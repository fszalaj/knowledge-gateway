name: release

# Two ways in, one job:
#   - a green `ci` run on main whose pyproject version has no tag yet -> cut that release;
#   - a manually pushed vX.Y.Z tag -> release that tag.
# Gating on the `ci` workflow_run rather than the raw push is what keeps a release
# known-green: a push-triggered release would race its own CI.
# Publish PyPI first, verify its actual distributions, then complete the GitHub release.
# Existing immutable tags pin retries; completion requires matching published asset hashes.
# A PyPI version without a tag needs investigation of its original source before retrying.
# Distribution is PyPI; immutable version tags identify the release source.
# One-time setup on pypi.org: add a pending publisher for project `knowledge-gateway` ->
# owner fszalaj, repo knowledge-gateway, workflow release.yml, environment pypi.
on:
  push:
    tags: ['v*']
  workflow_run:
    workflows: [ci]
    types: [completed]

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    # head_repository pins the run to this repo: a fork can name its branch `main`, so the
    # branch check alone would not keep fork CI out of the release path.
    if: >-
      github.event_name == 'push' ||
      (github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      id-token: write
    environment: pypi
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event_name == 'push' && github.ref || github.event.workflow_run.head_sha }}
          fetch-depth: 0

      # Keep the helper available when an incomplete release pins an older tagged tree.
      - name: Preserve release helper
        run: cp scripts/release.py "$RUNNER_TEMP/release.py"

      - name: Decide what to release
        id: plan
        env:
          GH_TOKEN: ${{ github.token }}
        run: python "$RUNNER_TEMP/release.py" decision

      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        if: steps.plan.outputs.release == 'true'
      - run: uv build
        if: steps.plan.outputs.release == 'true'

      # skip-existing keeps the job re-runnable: if a later step fails, re-running must not
      # die on "version already uploaded" - PyPI refuses a re-upload.
      - name: Publish to PyPI (Trusted Publishing)
        if: steps.plan.outputs.release == 'true'
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          skip-existing: true

      - name: Verify and stage published PyPI distributions
        if: steps.plan.outputs.release == 'true'
        run: python "$RUNNER_TEMP/release.py" stage --version "${{ steps.plan.outputs.version }}"

      - name: Publish GitHub Release (creates the immutable tag)
        if: steps.plan.outputs.release == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: python "$RUNNER_TEMP/release.py" publish --version "${{ steps.plan.outputs.version }}"
